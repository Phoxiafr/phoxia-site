<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>Logos Protection Financière</title>
<style>
:root{--ink:#0B1F4B;--muted:#5D6578;--page:#EEECE7;--card:#FBFAF7}
body.dark{--ink:#fff;--muted:#AEB7CC;--page:#07142F;--card:#0B1F4B}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-family:Georgia,serif}
header{max-width:1260px;margin:0 auto;padding:40px 16px 8px;display:flex;flex-wrap:wrap;gap:16px;align-items:end;justify-content:space-between}
h1{font-weight:400;font-size:34px;margin:0}header p{margin:6px 0 0;color:var(--muted);font:14px/1.5 system-ui,sans-serif}
button{font:600 12px system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:10px 16px;border-radius:999px;border:1px solid var(--ink);background:none;color:var(--ink);cursor:pointer}
main{max-width:1260px;margin:0 auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:20px}
figure{margin:0;background:var(--card);border-radius:12px;overflow:hidden}img{display:block;width:100%;height:auto}
.m{display:none}body.dark .m{display:block}body.dark .c{display:none}
figcaption{padding:14px 18px 18px;border-top:1px solid rgba(127,127,127,.2)}figcaption b{font-weight:400;font-size:20px}
figcaption span{display:block;color:var(--muted);font:13px/1.55 system-ui,sans-serif;margin-top:4px}
</style></head><body>
<header><div><h1>Protection Financière · 10 pistes</h1><p>Lettres vectorisées. La barre fait exactement la hauteur des capitales et l'épaisseur des fûts.</p></div>
<button id="t" type="button">Voir sur fond marine</button></header>
<main><figure><img class="c" src="svg/logo-01-clair.svg" alt="Piste 01"><img class="m" src="svg/logo-01-marine.svg" alt="Piste 01 sur fond marine">
<figcaption><b>01 · Garalde · P / F</b><span>Barre entre les deux lettres, logée sous la panse du P. Garamond, filet fin et capitales espacées : le registre d'une gestion privée.</span></figcaption></figure><figure><img class="c" src="svg/logo-02-clair.svg" alt="Piste 02"><img class="m" src="svg/logo-02-marine.svg" alt="Piste 02 sur fond marine">
<figcaption><b>02 · Garalde · PF /</b><span>Même dessin que la 01 avec la barre après le F, nichée sous ses bras. Pour comparer les deux placements à l'identique.</span></figcaption></figure><figure><img class="c" src="svg/logo-03-clair.svg" alt="Piste 03"><img class="m" src="svg/logo-03-marine.svg" alt="Piste 03 sur fond marine">
<figcaption><b>03 · Fût rouge</b><span>La barre AXA devient le fût du F : le P, puis un F dont la colonne est rouge. Un monogramme propriétaire, lisible et unique.</span></figcaption></figure><figure><img class="c" src="svg/logo-04-clair.svg" alt="Piste 04"><img class="m" src="svg/logo-04-marine.svg" alt="Piste 04 sur fond marine">
<figcaption><b>04 · Didone</b><span>Pleins et déliés très contrastés, la barre a l'épaisseur exacte des fûts. Verrouillage horizontal pour en-têtes, vitrine, cartes de visite.</span></figcaption></figure><figure><img class="c" src="svg/logo-05-clair.svg" alt="Piste 05"><img class="m" src="svg/logo-05-marine.svg" alt="Piste 05 sur fond marine">
<figcaption><b>05 · Transitionnelle · P / F</b><span>Playfair, plus charpentée et très lisible. La barre s'emboîte entre P et F pour former un bloc compact, idéal en icône.</span></figcaption></figure><figure><img class="c" src="svg/logo-06-clair.svg" alt="Piste 06"><img class="m" src="svg/logo-06-marine.svg" alt="Piste 06 sur fond marine">
<figcaption><b>06 · Italique</b><span>Lettres italiques, barre entre P et F. Plus chaleureux et personnel : la signature d'un conseiller.</span></figcaption></figure><figure><img class="c" src="svg/logo-07-clair.svg" alt="Piste 07"><img class="m" src="svg/logo-07-marine.svg" alt="Piste 07 sur fond marine">
<figcaption><b>07 · Épure</b><span>Capitales géométriques fines, beaucoup d'air, barre au même trait que les lettres. Contemporain et haut de gamme.</span></figcaption></figure><figure><img class="c" src="svg/logo-08-clair.svg" alt="Piste 08"><img class="m" src="svg/logo-08-marine.svg" alt="Piste 08 sur fond marine">
<figcaption><b>08 · Sceau</b><span>Format rond, en écho au logo circulaire de l'agence. Texte dessiné lettre à lettre sur le cercle. Avatar, tampon, signature mail.</span></figcaption></figure><figure><img class="c" src="svg/logo-09-clair.svg" alt="Piste 09"><img class="m" src="svg/logo-09-marine.svg" alt="Piste 09 sur fond marine">
<figcaption><b>09 · Arche</b><span>Une arche, comme l'entrée d'une maison solide : P/F en est la clé. Institutionnel et rassurant, sans le cliché du bouclier.</span></figcaption></figure><figure><img class="c" src="svg/logo-10-clair.svg" alt="Piste 10"><img class="m" src="svg/logo-10-marine.svg" alt="Piste 10 sur fond marine">
<figcaption><b>10 · Bloc justifié</b><span>PF/ en Didone douce, et le nom en deux lignes calées exactement sur la largeur du monogramme. Rigueur et précision, comme un bon conseil.</span></figcaption></figure></main>
<script>document.getElementById('t').onclick=function(){var d=document.body.classList.toggle('dark');this.textContent=d?'Voir sur fond clair':'Voir sur fond marine'}</script>
</body></html>
