<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Logos Protection Financière</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Josefin+Sans:wght@200;300&family=Marcellus&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0B1F4B;     /* bleu marine profond */
    --red: #FF1721;     /* rouge barre AXA */
    --paper: #FBFAF7;
    --muted: #6B7280;
    --page: #EEECE7;
  }
  body.dark { --ink: #FFFFFF; --paper: #0B1F4B; --muted: #AEB7CC; --page: #07142F; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font-family: Montserrat, system-ui, sans-serif; transition: background .3s; }
  header { max-width: 1240px; margin: 0 auto; padding: 40px 16px 8px; display: flex; flex-wrap: wrap; gap: 16px; align-items: end; justify-content: space-between; }
  h1 { font-family: "Cormorant Garamond", serif; font-weight: 600; font-size: 38px; margin: 0; }
  header p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
  button { font: 500 13px Montserrat, sans-serif; letter-spacing: .08em; text-transform: uppercase; padding: 10px 16px; border-radius: 999px; border: 1px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; }
  main { max-width: 1240px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 20px; }
  @media (max-width: 420px) { main { grid-template-columns: 1fr; } }
  figure { margin: 0; background: var(--paper); border-radius: 14px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.06); transition: background .3s; }
  figure svg { display: block; width: 100%; height: auto; }
  figcaption { padding: 14px 18px 18px; border-top: 1px solid rgba(127,127,127,.18); }
  figcaption b { font-family: "Cormorant Garamond", serif; font-size: 21px; font-weight: 600; }
  figcaption span { display: block; color: var(--muted); font-size: 13px; line-height: 1.5; margin-top: 4px; }
  .ink { fill: var(--ink); } .red { fill: var(--red); } .paper { fill: var(--paper); }
  .line { stroke: var(--ink); fill: none; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Protection Financière, 10 pistes de logo</h1>
    <p>PF et la barre rouge AXA, déclinés dans un registre conseil, prévoyance et patrimoine.</p>
  </div>
  <button id="t" type="button">Voir sur fond marine</button>
</header>
<main>

<!-- 01 HÉRITAGE -->
<figure id="logo-01">
<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(20 0)"><text class="ink" x="232" y="168" text-anchor="end" font-family="Cormorant Garamond" font-weight="600" font-size="138" letter-spacing="-2">PF</text>
  <polygon class="red" points="226,168 244,168 296,66 278,66"/></g>
  <line class="line" x1="150" y1="196" x2="330" y2="196" stroke-width="1"/>
  <text class="ink" x="240" y="222" text-anchor="middle" font-family="Montserrat" font-weight="500" font-size="13" letter-spacing="6">PROTECTION FINANCIÈRE</text>
  <text class="ink" x="240" y="246" text-anchor="middle" font-family="Cormorant Garamond" font-style="italic" font-weight="500" font-size="17" opacity=".8">Prévoyance &amp; Patrimoine</text>
</svg>
<figcaption><b>01 · Héritage</b><span>Garalde classique, filet fin, signature italique. Le registre d'une maison de gestion privée.</span></figcaption>
</figure>

<!-- 02 MONOLINE -->
<figure id="logo-02">
<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg">
  <g class="line" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 196 V62 H180 A33 33 0 0 1 180 128 H150"/>
    <path d="M278 196 V62 H330 M278 126 H318"/>
  </g>
  <polygon class="red" points="206,196 216,196 264,62 254,62"/>
  <text class="ink" x="240" y="240" text-anchor="middle" font-family="Cormorant Garamond" font-weight="600" font-size="22" letter-spacing="4">PROTECTION FINANCIÈRE</text>
  <text class="ink" x="240" y="262" text-anchor="middle" font-family="Montserrat" font-weight="400" font-size="10" letter-spacing="5" opacity=".75">ASSURANCES &amp; PATRIMOINE</text>
</svg>
<figcaption><b>02 · Monoline</b><span>Lettres dessinées au trait arrondi, comme le monogramme de l'agence Azoulay. Même famille visuelle.</span></figcaption>
</figure>

<!-- 03 ÉCUSSON -->
<figure id="logo-03">
<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg">
  <path class="line" stroke-width="2" d="M240 30 L318 52 V128 C318 178 284 206 240 224 C196 206 162 178 162 128 V52 Z"/>
  <path class="line" stroke-width="1" d="M240 40 L309 59 V128 C309 172 279 197 240 213 C201 197 171 172 171 128 V59 Z"/>
  <text class="ink" x="246" y="152" text-anchor="end" font-family="Marcellus" font-size="66">PF</text>
  <polygon class="red" points="241,152 251,152 279,92 269,92"/>
  <text class="ink" x="240" y="260" text-anchor="middle" font-family="Marcellus" font-size="18" letter-spacing="5">PROTECTION FINANCIÈRE</text>
  <text class="ink" x="240" y="281" text-anchor="middle" font-family="Montserrat" font-size="9.5" letter-spacing="4" opacity=".75">PRÉVOYANCE · PATRIMOINE</text>
</svg>
<figcaption><b>03 · Écusson</b><span>Le blason, symbole de protection. Double filet sobre, rassurant sans être lourd.</span></figcaption>
</figure>

<!-- 04 SCEAU -->
<figure id="logo-04">
<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <path id="arcTop4" d="M136 150 A104 104 0 0 1 344 150"/>
    <path id="arcBot4" d="M128 150 A112 112 0 0 0 352 150"/>
  </defs>
  <circle class="line" cx="240" cy="150" r="132" stroke-width="1.6"/>
  <circle class="line" cx="240" cy="150" r="86" stroke-width="1"/>
  <text class="ink" font-family="Cormorant Garamond" font-weight="600" font-size="17" letter-spacing="3"><textPath href="#arcTop4" startOffset="50%" text-anchor="middle">PROTECTION FINANCIÈRE</textPath></text>
  <text class="ink" font-family="Montserrat" font-weight="500" font-size="10.5" letter-spacing="4"><textPath href="#arcBot4" startOffset="50%" text-anchor="middle">PRÉVOYANCE &amp; PATRIMOINE</textPath></text>
  <path class="ink" d="M113 150 l5 -5 l5 5 l-5 5 Z M357 150 l5 -5 l5 5 l-5 5 Z"/>
  <text class="ink" x="246" y="178" text-anchor="end" font-family="Cormorant Garamond" font-weight="600" font-size="84">PF</text>
  <polygon class="red" points="241,178 252,178 286,112 275,112"/>
</svg>
<figcaption><b>04 · Sceau</b><span>Format rond, en écho au logo circulaire de l'agence. Idéal en avatar, tampon, signature mail.</span></figcaption>
</figure>

<!-- 05 LIGATURE -->
<figure id="logo-05">
<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(-34 0)"><g class="line" stroke-width="20" stroke-linejoin="miter">
    <path d="M190 210 V60"/>
    <path d="M180 70 H322"/>
    <path d="M190 70 H232 A41 41 0 0 1 232 152 H190 H294"/>
  </g>
  <polygon class="red" points="300,210 318,210 362,60 344,60"/></g>
  <text class="ink" x="243" y="252" text-anchor="middle" font-family="Montserrat" font-weight="500" font-size="13" letter-spacing="7">PROTECTION FINANCIÈRE</text>
</svg>
<figcaption><b>05 · Ligature</b><span>P et F partagent la même colonne : six associés, une seule structure. Monogramme propriétaire, impossible à confondre.</span></figcaption>
</figure>

<!-- 06 CARTOUCHE -->
<figure id="logo-06">
<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg">
  <rect class="ink" x="56" y="80" width="140" height="140" rx="6"/>
  <text class="paper" x="68" y="178" font-family="Montserrat" font-weight="600" font-size="60" letter-spacing="-1">PF</text>
  <polygon class="red" points="140,232 155,232 221,68 206,68"/>
  <text class="ink" x="246" y="146" font-family="Cormorant Garamond" font-weight="600" font-size="38">Protection</text>
  <text class="ink" x="246" y="184" font-family="Cormorant Garamond" font-weight="600" font-size="38">Financière</text>
  <text class="ink" x="247" y="210" font-family="Montserrat" font-size="9" letter-spacing="2.6" opacity=".75">ASSURANCES &amp; PATRIMOINE</text>
</svg>
<figcaption><b>06 · Cartouche</b><span>Le carré marine que la barre rouge traverse et dépasse, clin d'œil assumé au code AXA. Très lisible en petit.</span></figcaption>
</figure>

<!-- 07 DIDONE -->
<figure id="logo-07">
<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(-22 0)"><text class="ink" x="190" y="186" text-anchor="end" font-family="Bodoni Moda" font-weight="700" font-size="112">PF</text>
  <polygon class="red" points="186,186 200,186 246,96 232,96"/>
  <line class="line" x1="272" y1="104" x2="272" y2="186" stroke-width="1"/>
  <text class="ink" x="290" y="138" font-family="Bodoni Moda" font-weight="500" font-size="20" letter-spacing="2">PROTECTION</text>
  <text class="ink" x="290" y="166" font-family="Bodoni Moda" font-weight="500" font-size="20" letter-spacing="2">FINANCIÈRE</text>
  <text class="ink" x="291" y="185" font-family="Montserrat" font-size="7.6" letter-spacing="2.2" opacity=".7">PRÉVOYANCE · PATRIMOINE</text></g>
</svg>
<figcaption><b>07 · Didone</b><span>Contrastes pleins et déliés, façon banque privée ou maison de luxe. Format horizontal pour en-têtes et vitrines.</span></figcaption>
</figure>

<!-- 08 SIX PILIERS -->
<figure id="logo-08">
<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg">
  <text class="ink" x="246" y="132" text-anchor="end" font-family="Cinzel" font-weight="600" font-size="84">PF</text>
  <polygon class="red" points="241,132 253,132 289,62 277,62"/>
  <rect class="ink" x="156" y="148" width="168" height="3"/>
  <g class="ink">
    <rect x="166" y="157" width="5" height="40"/><rect x="194" y="157" width="5" height="40"/><rect x="222" y="157" width="5" height="40"/>
    <rect x="253" y="157" width="5" height="40"/><rect x="281" y="157" width="5" height="40"/><rect x="309" y="157" width="5" height="40"/>
  </g>
  <rect class="ink" x="156" y="203" width="168" height="3"/>
  <text class="ink" x="240" y="240" text-anchor="middle" font-family="Cinzel" font-weight="500" font-size="17" letter-spacing="4">PROTECTION FINANCIÈRE</text>
  <text class="ink" x="240" y="261" text-anchor="middle" font-family="Montserrat" font-size="9.5" letter-spacing="4" opacity=".75">ASSURANCES &amp; PATRIMOINE</text>
</svg>
<figcaption><b>08 · Six piliers</b><span>Six colonnes pour les six co-gérants. Solidité, institution, confiance : le message est porté par la forme.</span></figcaption>
</figure>

<!-- 09 SIGNATURE -->
<figure id="logo-09">
<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg">
  <text class="ink" x="238" y="172" text-anchor="end" font-family="Cormorant Garamond" font-style="italic" font-weight="600" font-size="140">PF</text>
  <polygon class="red" points="234,172 252,172 312,62 294,62"/>
  <text class="ink" x="240" y="220" text-anchor="middle" font-family="Cormorant Garamond" font-style="italic" font-weight="500" font-size="28">Protection Financière</text>
  <line class="line" x1="150" y1="242" x2="186" y2="242" stroke-width=".8"/>
  <line class="line" x1="294" y1="242" x2="330" y2="242" stroke-width=".8"/>
  <text class="ink" x="240" y="246" text-anchor="middle" font-family="Montserrat" font-size="9" letter-spacing="3" opacity=".75">PATRIMOINE</text>
</svg>
<figcaption><b>09 · Signature</b><span>Italique calligraphique, la barre suit l'inclinaison des lettres. Chaleureux et personnel, comme une signature de conseiller.</span></figcaption>
</figure>

<!-- 10 ÉPURE -->
<figure id="logo-10">
<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(22 0)"><text class="ink" x="236" y="170" text-anchor="end" font-family="Josefin Sans" font-weight="200" font-size="126" letter-spacing="10">PF</text>
  <polygon class="red" points="232,170 242,170 300,62 290,62"/></g>
  <text class="ink" x="240" y="222" text-anchor="middle" font-family="Cormorant Garamond" font-weight="600" font-size="20" letter-spacing="8">PROTECTION FINANCIÈRE</text>
  <text class="ink" x="240" y="246" text-anchor="middle" font-family="Josefin Sans" font-weight="300" font-size="11" letter-spacing="5" opacity=".75">CONSEIL EN ASSURANCE &amp; PATRIMOINE</text>
</svg>
<figcaption><b>10 · Épure</b><span>Capitales ultra fines et beaucoup d'air. Moderne et haut de gamme, l'opposé exact du style sport.</span></figcaption>
</figure>

</main>
<script>
  document.getElementById('t').addEventListener('click', function () {
    var d = document.body.classList.toggle('dark');
    this.textContent = d ? 'Voir sur fond clair' : 'Voir sur fond marine';
  });
</script>
</body>
</html>
