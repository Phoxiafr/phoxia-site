<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Carrousel Claude Phoxia</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@1,400;1,500&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --encre:#05070b;--surface:#0d131d;--sable:#e9eef5;--sable-doux:#9ba7b8;--gris:#7d8899;
  --ligne:rgba(233,238,245,.08);--ligne-forte:rgba(233,238,245,.16);
  --bleu:#5ba3dd;--bleu-vif:#8cc8f2;--bleu-fonce:#1c6ba8;
  --titre:"Instrument Sans",Arial,sans-serif;--logo:"EB Garamond",Georgia,serif;--mono:"IBM Plex Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:var(--titre);color:var(--sable);-webkit-font-smoothing:antialiased}
.slide{width:1080px;height:1350px;position:relative;overflow:hidden;background:var(--encre);padding:96px 96px 88px;display:flex;flex-direction:column;page-break-after:always}
.slide::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(900px 640px at 92% -8%,rgba(28,107,168,.42),transparent 70%),
             radial-gradient(700px 800px at -12% 55%,rgba(91,163,221,.14),transparent 70%),
             radial-gradient(1000px 600px at 50% 118%,rgba(28,107,168,.30),transparent 70%)}
.slide::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.7;
  background-image:linear-gradient(var(--ligne) 1px,transparent 1px),linear-gradient(90deg,var(--ligne) 1px,transparent 1px);
  background-size:90px 90px;
  -webkit-mask-image:radial-gradient(ellipse 85% 70% at 50% 0%,#000 10%,transparent 72%)}
.slide>*{position:relative;z-index:1}
.haut{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:var(--sable-doux)}
.marque{display:flex;align-items:center;gap:16px;font-family:var(--logo);font-style:italic;font-size:40px;letter-spacing:0;text-transform:none;color:var(--sable)}
.marque img{width:52px}
.bas{margin-top:auto;display:flex;white-space:nowrap;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:21px;letter-spacing:.12em;text-transform:uppercase;color:var(--gris);border-top:1px solid var(--ligne-forte);padding-top:30px}
.bas b{color:var(--bleu-vif);font-weight:500}
.prog{display:flex;gap:8px}.prog i{width:26px;height:4px;background:var(--ligne-forte);border-radius:2px}.prog i.on{background:var(--bleu)}
.num{font-family:var(--mono);font-size:24px;letter-spacing:.16em;color:var(--bleu-vif);margin-top:96px;display:flex;align-items:center;gap:18px}
.num::before{content:"";width:44px;height:1px;background:var(--bleu)}
h1,h2{font-weight:600;letter-spacing:-.035em;line-height:1.02}
h2{font-size:88px;margin-top:30px}
em{font-family:var(--logo);font-style:italic;font-weight:400;letter-spacing:-.01em;color:var(--bleu-vif)}
.texte{font-size:34px;line-height:1.42;color:var(--sable-doux);margin-top:40px;max-width:860px}
.texte strong{color:var(--sable);font-weight:600}
.prompt{margin-top:52px;border:1px solid var(--ligne-forte);background:rgba(13,19,29,.72);border-radius:20px;padding:34px 38px;box-shadow:0 0 80px rgba(28,107,168,.18) inset}
.prompt .etq{font-family:var(--mono);font-size:19px;letter-spacing:.16em;text-transform:uppercase;color:var(--bleu);display:flex;align-items:center;gap:12px;margin-bottom:18px}
.prompt .etq::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--bleu);box-shadow:0 0 14px var(--bleu)}
.prompt p{font-family:var(--mono);font-size:27px;line-height:1.5;color:var(--sable)}
.publics{display:flex;gap:12px;margin-top:40px;margin-bottom:40px;flex-wrap:wrap}
.publics span{font-family:var(--mono);font-size:19px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--ligne-forte);border-radius:99px;padding:10px 20px;color:var(--sable-doux)}
.publics span.on{border-color:var(--bleu);color:var(--bleu-vif);background:rgba(28,107,168,.16)}
/* Couverture */
.couv h1{font-size:132px;margin-top:150px}
.couv .chapo{font-size:38px;line-height:1.38;color:var(--sable-doux);margin-top:48px;max-width:820px}
.couv .grand-symbole{position:absolute;right:96px;top:200px;width:250px;opacity:.95;filter:drop-shadow(0 0 60px rgba(91,163,221,.45));z-index:0}
.couv .pastille{display:inline-flex;align-items:center;gap:14px;margin-top:150px;font-family:var(--mono);font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:var(--bleu-vif);border:1px solid var(--bleu);border-radius:99px;padding:14px 26px;align-self:flex-start;background:rgba(28,107,168,.14)}
.liste{margin-top:56px;display:grid;gap:0}
.liste div{display:flex;gap:28px;align-items:baseline;border-top:1px solid var(--ligne-forte);padding:22px 0;font-size:32px;color:var(--sable)}
.liste div span{font-family:var(--mono);font-size:22px;color:var(--bleu);letter-spacing:.1em;min-width:56px}
.fin h2{font-size:104px;margin-top:120px}
.cta{margin-top:56px;display:inline-flex;align-items:center;gap:18px;background:var(--sable);color:var(--encre);font-weight:600;font-size:34px;border-radius:99px;padding:26px 44px;align-self:flex-start}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const tips = [
 {t:'Un <em>Projet</em> par sujet de travail',
  x:'Créez un Projet par client, par cours ou par activité. Déposez-y vos documents de référence et des <strong>instructions permanentes</strong>. Claude repart du bon contexte à chaque nouvelle discussion.',
  p:'Instructions du projet : tu es mon bras droit commercial. Ton ton : direct, chaleureux, jamais jargonnant. Appuie-toi toujours sur la grille tarifaire jointe.',
  a:['Dirigeants','Pros','Étudiants']},
 {t:'Faites-vous <em>interviewer</em> avant de produire',
  x:'Le meilleur prompt, c’est souvent Claude qui l’écrit avec vous. Demandez-lui de <strong>poser ses questions d’abord</strong> : il comble les trous que vous n’aviez pas vus.',
  p:'Avant de rédiger quoi que ce soit, pose-moi les 5 questions qui te manquent pour faire un travail excellent. Une à la fois.',
  a:['Dirigeants','Pros','Étudiants']},
 {t:'Rangez votre prompt avec des <em>balises</em>',
  x:'Claude lit très bien les balises de type XML. Séparez le contexte, les documents et la consigne : <strong>moins de confusion, des réponses plus précises</strong>, surtout sur les longs textes.',
  p:'&lt;contexte&gt;PME de 12 personnes, BTP&lt;/contexte&gt;\n&lt;document&gt;[devis collé]&lt;/document&gt;\n&lt;consigne&gt;Repère les 3 risques&lt;/consigne&gt;',
  a:['Pros','Dirigeants']},
 {t:'Montrez un <em>exemple</em>, ne décrivez pas',
  x:'Plutôt que trois lignes pour expliquer le ton voulu, collez <strong>un mail, un post ou une fiche que vous aimez</strong>. Un exemple vaut dix adjectifs.',
  p:'Voici 2 mails que j’ai écrits et qui ont bien marché. Rédige la relance client dans exactement le même style.',
  a:['Dirigeants','Pros','Étudiants']},
 {t:'<em>Modifiez</em> votre message au lieu d’empiler',
  x:'Réponse à côté ? Ne répondez pas « non, plutôt… ». Cliquez sur <strong>Modifier</strong> votre message d’origine : vous repartez sur une branche propre, sans le brouillon raté dans le contexte.',
  e:'Le réflexe',p:'Une conversation trop longue dérive. Demandez un résumé, puis collez-le dans une nouvelle discussion.',
  a:['Pros','Étudiants']},
 {t:'Demandez un <em>outil</em>, pas un texte',
  x:'Avec les Artifacts, Claude construit des <strong>mini applications utilisables tout de suite</strong> : simulateur de prix, quiz de révision, checklist interactive, tableau de bord.',
  p:'Crée-moi un simulateur de marge : je saisis prix d’achat, prix de vente et volume, il affiche marge et seuil de rentabilité.',
  a:['Dirigeants','Étudiants']},
 {t:'Apprenez-lui <em>votre</em> plume',
  x:'Dans les Styles, créez un style personnalisé à partir de <strong>vos propres textes</strong>. Vos posts, mails et propositions sonnent comme vous, pas comme une IA.',
  p:'Analyse ces 3 textes et décris mon style en 10 règles concrètes (longueur de phrase, vocabulaire, ce que j’évite).',
  a:['Dirigeants','Pros']},
 {t:'Branchez votre <em>quotidien</em>',
  x:'Avec les connecteurs (Gmail, Agenda, Drive, Notion…), Claude travaille sur <strong>vos vraies données</strong>, sans copier-coller. Le gain de temps est immédiat.',
  p:'Regarde mon agenda de demain et mes mails non lus. Prépare un brief de 5 lignes par rendez-vous et les 3 réponses urgentes.',
  a:['Dirigeants','Pros']},
 {t:'Faites-le <em>vous contredire</em>',
  x:'Par défaut, une IA a tendance à aller dans votre sens. Pour les vraies décisions, activez la <strong>réflexion approfondie</strong> et demandez-lui explicitement de jouer l’avocat du diable.',
  p:'Voici mon projet de recrutement. Donne-moi les 5 meilleures raisons de NE PAS le faire, puis ce qui te ferait changer d’avis.',
  a:['Dirigeants','Étudiants']},
 {t:'Transformez vos routines en <em>Skills</em>',
  x:'Une tâche que vous refaites chaque semaine ? Compte rendu, devis, fiche de révision… Décrivez la méthode une fois : <strong>Claude la réapplique à l’identique</strong>, à chaque fois.',
  p:'On vient de faire ce compte rendu ensemble. Transforme cette méthode en Skill réutilisable pour mes prochaines réunions.',
  a:['Dirigeants','Pros','Étudiants']},
];
const N = tips.length + 2;
const symb = '<img src="symbole.svg" alt="">';
const haut = (r) => `<div class="haut"><span class="marque">Phoxia ${symb}</span><span>${r}</span></div>`;
const prog = (k) => `<span class="prog">${Array.from({length:N},(_,i)=>`<i class="${i===k?'on':''}"></i>`).join('')}</span>`;
const bas = (k, d) => `<div class="bas"><span>${d}</span>${prog(k)}</div>`;
let h = '';
h += `<section class="slide couv">
  ${haut('Guide · 2026')}
  <img class="grand-symbole" src="symbole.svg" alt="">
  <h1>10 astuces pour utiliser Claude comme <em>un pro</em></h1>
  <p class="chapo">Ce que la plupart des utilisateurs ne font pas encore. Pour dirigeants de PME, étudiants et professionnels.</p>
  <span class="pastille">Glissez pour découvrir →</span>
  ${bas(0,'<b>phoxia.fr</b>')}
</section>`;
tips.forEach((tp,i)=>{
  const n = String(i+1).padStart(2,'0');
  const pub = ['Dirigeants','Pros','Étudiants'].map(a=>`<span class="${tp.a.includes(a)?'on':''}">${a}</span>`).join('');
  h += `<section class="slide">
    ${haut('Claude · Astuces')}
    <div class="num">ASTUCE ${n} / 10</div>
    <h2>${tp.t}</h2>
    <p class="texte">${tp.x}</p>
    <div class="prompt"><div class="etq">${tp.e||'À copier'}</div><p>${tp.p.replace(/\n/g,'<br>')}</p></div>
    <div class="publics">${pub}</div>
    ${bas(i+1,'<b>phoxia.fr</b>')}
  </section>`;
});
h += `<section class="slide fin">
  ${haut('Récap')}
  <h2>L’IA ne remplace pas votre <em>savoir-faire</em>. Elle le démultiplie.</h2>
  <div class="liste">
    <div><span>01</span>Contexte permanent avec les Projets</div>
    <div><span>02</span>Des exemples plutôt que des adjectifs</div>
    <div><span>03</span>Des outils, des connecteurs, des Skills</div>
  </div>
  <span class="cta">Former vos équipes → phoxia.fr</span>
  ${bas(N-1,'Enregistrez ce post')}
</section>`;
document.getElementById('deck').innerHTML = h;
</script>
</body>
</html>
