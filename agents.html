<meta name="robots" content="noindex, follow">

<style>
  :root {
    --nuit: #0B0B0D;
    --nuit-2: #16151A;
    --or: #C9A45C;
    --or-clair: #E7CE93;
    --ivoire: #F2ECE0;
    --gris: #9A958C;
    --serif: "EB Garamond", Georgia, serif;
    --sans: "Instrument Sans", system-ui, sans-serif;
  }
  * , *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--nuit);
    color: var(--ivoire);
    font-family: var(--sans);
    line-height: 1.6;
    overflow-x: clip;
  }
  img, svg { display: block; max-width: 100%; height: auto; }
  a { color: var(--or-clair); }

  .enveloppe { width: min(1200px, 100% - 32px); margin-inline: auto; }

  /* Bandeau */
  .bandeau {
    padding: 56px 0 28px;
    text-align: center;
  }
  .surtitre {
    font-size: .78rem;
    letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--or);
    margin: 0 0 14px;
  }
  h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(2.2rem, 6vw, 4.4rem);
    line-height: 1.05;
    margin: 0;
  }
  h1 em { color: var(--or-clair); }
  .chapeau {
    max-width: 620px;
    margin: 18px auto 0;
    color: var(--gris);
  }

  .logo-phoxia { width: 200px; margin: 0 auto 14px; }

  /* Scène */
  .scene {
    margin: 24px auto 0;
    border: 1px solid rgba(201,164,92,.35);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 40px 120px rgba(0,0,0,.6);
  }
  .scene svg { width: 100%; }

  .scene + .scene { margin-top: 48px; }
  .scene figcaption {
    padding: 14px 18px;
    background: var(--nuit-2);
    color: var(--gris);
    font-size: .9rem;
    border-top: 1px solid rgba(201,164,92,.25);
  }
  .scene figcaption strong { color: var(--ivoire); font-weight: 500; }
  .pied {
    padding: 48px 0 64px;
    text-align: center;
    color: var(--gris);
    font-size: .85rem;
  }
</style>
</head>
